<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Counter</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #16161d;
    --surface-2: #1f1f29;
    --border: #2a2a36;
    --text: #f4f4f7;
    --muted: #9a9aab;
    --accent: #7c5cff;
    --accent-hover: #9079ff;
    --accent-ink: #ffffff;
    --danger: #ff5c7a;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
    --radius-lg: 24px;
    --radius-md: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(124,92,255,0.18) 0%, rgba(124,92,255,0) 60%),
      var(--bg);
  }

  header {
    padding: 20px 4px 0;
    text-align: center;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 24px 0;
  }

  .display {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1;
    max-height: 340px;
    border-radius: var(--radius-lg);
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .display::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 110%, rgba(124,92,255,0.22), transparent 60%);
    pointer-events: none;
  }

  #count {
    font-size: clamp(88px, 28vw, 120px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    transition: transform 180ms ease, color 180ms ease;
    position: relative;
  }

  #count.bump { transform: scale(1.08); }
  #count.neg { color: var(--danger); }
  #count.pos { color: var(--text); }

  .caption {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    position: relative;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 340px;
  }

  button {
    font: inherit;
    border: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 150ms ease, background-color 200ms ease, box-shadow 200ms ease, opacity 200ms ease, color 200ms ease, border-color 200ms ease;
  }

  button:active { transform: scale(0.96); }

  button:focus-visible {
    outline: 3px solid var(--accent-hover);
    outline-offset: 3px;
  }

  .btn {
    min-height: 72px;
    border-radius: var(--radius-md);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-minus {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-minus:hover { background: #262634; }

  .btn-plus {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 8px 24px rgba(124,92,255,0.35);
  }
  .btn-plus:hover { background: var(--accent-hover); }

  .btn-minus:disabled, .btn-plus:disabled { opacity: 0.4; cursor: not-allowed; }

  .actions {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 340px;
    justify-content: center;
  }

  .ghost {
    min-height: 44px;
    min-width: 44px;
    padding: 0 18px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
  }
  .ghost:hover { color: var(--text); border-color: #3a3a4a; }

  .ghost.reset:hover,
  .ghost.reset.armed { color: var(--danger); border-color: var(--danger); }

  footer {
    padding: 0 4px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Counter</div>
</header>

<main>
  <section class="display" aria-live="polite">
    <div id="count" class="pos">0</div>
    <div class="caption" id="caption">Tap + to start</div>
  </section>

  <div class="controls">
    <button class="btn btn-minus" id="minus" aria-label="Decrease by one">&minus;</button>
    <button class="btn btn-plus" id="plus" aria-label="Increase by one">+</button>
  </div>

  <div class="actions">
    <button class="ghost reset" id="reset" aria-label="Reset counter to zero">Reset</button>
  </div>
</main>

<footer>Saved automatically on this device</footer>

<div class="toast" id="toast" role="status"></div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const STORAGE_KEY = "counter-app:value";
  const MIN = -999, MAX = 999;
  const RESET_CONFIRM_MS = 2500;

  const countEl = document.getElementById("count");
  const captionEl = document.getElementById("caption");
  const plusBtn = document.getElementById("plus");
  const minusBtn = document.getElementById("minus");
  const resetBtn = document.getElementById("reset");
  const toastEl = document.getElementById("toast");

  let value = 0;
  let toastTimer = null;
  let resetArmed = false;
  let resetTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const n = Number.parseInt(raw, 10);
      if (Number.isFinite(n)) value = clamp(n);
    } catch (_) { /* storage unavailable; run in memory */ }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, String(value)); } catch (_) {}
  }

  function clamp(n) { return Math.min(MAX, Math.max(MIN, n)); }

  function haptic(style = "light") {
    tg?.HapticFeedback?.impactOccurred?.(style);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function render(bump = false) {
    countEl.textContent = value.toLocaleString("en-US");
    countEl.classList.toggle("neg", value < 0);
    countEl.classList.toggle("pos", value >= 0);

    plusBtn.disabled = value >= MAX;
    minusBtn.disabled = value <= MIN;

    if (value === 0) captionEl.textContent = "Tap + to start";
    else if (value === MAX) captionEl.textContent = "Maximum reached";
    else if (value === MIN) captionEl.textContent = "Minimum reached";
    else if (value > 0) captionEl.textContent = value === 1 ? "1 step up" : `${value} steps up`;
    else captionEl.textContent = Math.abs(value) === 1 ? "1 step down" : `${Math.abs(value)} steps down`;

    if (bump) {
      countEl.classList.remove("bump");
      void countEl.offsetWidth;
      countEl.classList.add("bump");
      setTimeout(() => countEl.classList.remove("bump"), 180);
    }
  }

  function change(delta) {
    const next = clamp(value + delta);
    if (next === value) {
      haptic("rigid");
      toast(delta > 0 ? "Maximum reached" : "Minimum reached");
      return;
    }
    value = next;
    save();
    haptic("light");
    render(true);
  }

  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    resetBtn.textContent = "Reset";
    resetBtn.setAttribute("aria-label", "Reset counter to zero");
    resetBtn.classList.remove("armed");
  }

  function resetToZero() {
    disarmReset();
    value = 0;
    save();
    haptic("medium");
    render(true);
    toast("Reset to zero");
  }

  plusBtn.addEventListener("click", () => change(1));
  minusBtn.addEventListener("click", () => change(-1));

  resetBtn.addEventListener("click", () => {
    if (value === 0) { disarmReset(); toast("Already at zero"); return; }

    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = "Tap again to reset";
      resetBtn.setAttribute("aria-label", "Tap again to confirm reset to zero");
      resetBtn.classList.add("armed");
      haptic("light");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(disarmReset, RESET_CONFIRM_MS);
      return;
    }

    resetToZero();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") change(1);
    else if (e.key === "ArrowDown" || e.key === "-" || e.key === "_") change(-1);
    else if (e.key === "0" && value !== 0) resetToZero();
  });

  load();
  render();
</script>
</body>
</html>
